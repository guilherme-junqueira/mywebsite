<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="stylesheet" href="site/styles.css?v=1777171418575" />
<link rel="icon" type="image/png" sizes="32x32" href="site/assets/favicon-32.png" />

  function gtag(){dataLayer.push(arguments);}

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="site/data.js?v=1777171418575"></script>
<script type="text/babel" src="site/layout.jsx?v=1777171418575"></script>
<script type="text/babel" data-presets="react">
  const D = window.SITE_DATA;
  function Discussions() {
    return (
      <Layout active="discussions">
        <h2 className="cl-section-h">Discussions</h2>
        <ul className="cl-talks-list">
          {D.discussions.map((d,i) => (
            <li key={i}>
              <span className="date">{d.year}</span>
              <span className="body">
                <em>"{d.paper}"</em>
                <span className="sub">
                  by {d.author} — {d.venue}
                  {d.slidesUrl && <React.Fragment> · <a href={d.slidesUrl} target="_blank" rel="noopener">Slides [PDF]</a></React.Fragment>}
                </span>
              </span>
            </li>
          ))}
        </ul>

        <h2 className="cl-section-h">Session Chair</h2>
        <ul className="cl-talks-list">
          {D.sessionChair.map((s,i) => (
            <li key={i}>
              <span className="date">{s.year}</span>
              <span className="body">{s.role} — {s.venue}<span className="sub">{s.location}</span></span>
            </li>
          ))}
        </ul>
      </Layout>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Discussions />);
</script>
</body>
</html>
