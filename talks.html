<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="site/data.js?v=59"></script>
<script type="text/babel" src="site/layout.jsx?v=32"></script>
<script type="text/babel" data-presets="react">
  const D = window.SITE_DATA;

  function ytThumb(url) {
    const m = url.match(/[?&]v=([^&]+)/);
    return m ? `https://img.youtube.com/vi/${m[1]}/hqdefault.jpg` : null;
  }

  // Aggregate all talks across papers (conferences + seminars). Each paper carries
  // its own short tag we surface alongside the venue.
  // Year is parsed from trailing 4-digit number; entries with trailing "*" are by co-author.
  function buildAllTalks() {
    const allPapers = [
      ...(D.publications || []),
      ...(D.workingPapers || []),
      ...(D.worksInProgress || []),
    ];

    const tagFor = (p) => {
      // short paper-level tag for grouping context
      const t = p.title || "";
      if (/Democratizing Venture Capital/i.test(t)) return "QSBS Geography";
      if (/Tax Incentives and Venture Capital/i.test(t)) return "QSBS Risk-Taking";
      if (/Entrepreneurship on a Safety Net/i.test(t)) return "Bolsa Família";
      if (/Homeownership Hinders/i.test(t)) return "Housing Lottery";
      if (/Measuring Innovation/i.test(t)) return "Food Innovation";
      if (/Industrial Organization of Private Equity/i.test(t)) return "PE Industrial Org.";
      return t.split(":")[0];
    };

    const out = [];
    for (const p of allPapers) {
      const tag = tagFor(p);
      // Conferences (use full list, not just topConferences)
      let conf = (p.conferences && p.conferences.length) ? p.conferences : (p.topConferences || []);
      // For publications-only papers, ensure topConferences are also included
      if (p.topConferences && (!p.conferences || p.conferences.length === 0)) {
        conf = p.topConferences;
      }
      for (const c of conf) {
        const raw = c.name;
        const byCoauthor = /\*\s*$/.test(raw);
        const cleanName = raw.replace(/\*\s*$/, "").trim();
        const ym = cleanName.match(/(20\d{2})\s*$/);
        const year = ym ? parseInt(ym[1], 10) : null;
        const display = ym ? cleanName.slice(0, ym.index).replace(/[,\s]+$/, '').trim() : cleanName;
        out.push({
          year,
          venue: display,
          url: c.url,
          byCoauthor,
          tag,
          kind: "conference",
        });
      }
      // Seminars (now dated objects)
      for (const s of (p.seminars || [])) {
        const raw = (typeof s === "string") ? s : s.name;
        const byCoauthor = /\*\s*$/.test(raw);
        const cleanName = raw.replace(/\*\s*$/, "").trim();
        const year = (typeof s === "string") ? null : (s.year || null);
        out.push({
          year,
          venue: cleanName,
          byCoauthor,
          tag,
          kind: "seminar",
        });
      }
    }

    // De-duplicate identical (venue, year, tag) — same paper at same venue shouldn't appear twice
    const seen = new Set();
    return out.filter(t => {
      const k = `${t.kind}|${t.venue}|${t.year}|${t.tag}`;
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    });
  }

  function Talks() {
    const all = buildAllTalks();

    // De-dup: count how many papers map to each (venue, year, byCoauthor) so we can show "(N Papers)"
    const byKey = new Map();
    for (const t of all) {
      const k = `${t.venue}|${t.year}|${t.byCoauthor}`;
      if (!byKey.has(k)) byKey.set(k, { ...t, count: 1 });
      else byKey.get(k).count += 1;
    }
    const merged = Array.from(byKey.values());

    // Explicit hand-ordered priority lists per year. Venues matched here appear in the
    // listed order; everything else falls through to alphabetic order after them.
    const PRIORITY = {
      2026: [
        "NBER New Developments in Long-Term Asset Management",
        "NBER Tax Policy and the Economy",
        "SFS Cavalcade",
        "WFA",
        "FIRS",
        "EFA",
        "LSE Workshop on Capital Gains Tax",
        "CEPR Development Economics Symposium",
        "CEPR Summer Conference on Financial Intermediation and Corporate Finance",
        "Society of Labor Economists (SOLE) Annual Meeting",
        "IFN Stockholm Conference on Firms and Human Capital",
        "University of Melbourne's Finance Down Under Conference",
        "SGF Conference at the University of Zurich",
        "Inaugural Rutgers Finance Research Conference",
        "World Bank Land and Property Research Conference",
      ],
      2025: [
        "NBER Innovation Information Initiative",
        "NBER Place-Based Policies and Entrepreneurship",
        "NBER Public Economics",
        "NBER Economic Analysis of Business Taxation",
        "London Business School's Private Capital Symposium",
        "University of Oregon Finance Conference",
      ],
    };
    const priorityRank = (venue, year) => {
      const list = PRIORITY[year];
      if (!list) return Infinity;
      for (let i = 0; i < list.length; i++) {
        if (venue.toLowerCase().includes(list[i].toLowerCase())) return i;
      }
      return Infinity;
    };

    // Group ALL (conferences + seminars) by year, descending.
    // Within a year: priority rank first (hand-ordered list), then alphabetic.
    const years = Array.from(new Set(merged.map(t => t.year).filter(Boolean))).sort((a,b) => b - a);
    const byYear = Object.fromEntries(
      years.map(y => [y, merged.filter(t => t.year === y).sort((a,b) => {
        const ra = priorityRank(a.venue, y), rb = priorityRank(b.venue, y);
        if (ra !== rb) return ra - rb;
        return a.venue.localeCompare(b.venue);
      })])
    );

    return (
      <Layout active="talks">
        <h1 className="cl-page-title">Talks</h1>
        <p className="cl-page-sub">Recorded talks and complete list of conference and seminar presentations.</p>

        <h2 className="cl-section-h">Recorded Talks</h2>
        <div className="cl-videos">
          {D.videos.map((v,i) => (
            <a key={i} href={v.url} target="_blank" rel="noopener" className="card">
              <div className="thumb" style={{
                backgroundImage: `linear-gradient(180deg, rgba(0,0,0,0.05), rgba(0,0,0,0.45)), url(${ytThumb(v.url)})`,
                backgroundSize: 'cover', backgroundPosition: 'center'
              }}></div>
              <div className="meta">
                <div className="ttl">{v.title} ({v.year})</div>
                <div className="sub">Paper: {v.paper}</div>
              </div>
            </a>
          ))}
        </div>

        <h2 className="cl-section-h">All Talks</h2>
        <p className="sans" style={{fontSize:13, color:'var(--ink-3)', marginTop:-6, marginBottom:18}}>
          Conferences and workshops, then seminar series, by year (including scheduled). Entries marked with * were presented by a co-author.
        </p>

        {years.map(y => {
          const all = byYear[y];
          const conf = all.filter(t => t.kind === 'conference');
          const sem = all.filter(t => t.kind === 'seminar');
          return (
            <div key={y} className="cl-year-block">
              <h3 className="cl-year-head">{y}</h3>
              {conf.length > 0 && (
                <div className="cl-subgroup">
                  <div className="cl-sublabel">Conferences &amp; Workshops</div>
                  <ul className="cl-talks-list">
                    {conf.map((t,i) => (
                      <li key={i}>
                        <span className="body">
                          {t.url
                            ? <a href={t.url} target="_blank" rel="noopener">{t.venue}</a>
                            : t.venue}
                          {t.count > 1 && <span className="cl-mult"> ({t.count} Papers)</span>}
                          {t.byCoauthor && <span className="cl-co">*</span>}
                        </span>
                      </li>
                    ))}
                  </ul>
                </div>
              )}
              {sem.length > 0 && (
                <div className="cl-subgroup">
                  <div className="cl-sublabel">Seminars</div>
                  <ul className="cl-talks-list">
                    {sem.map((t,i) => (
                      <li key={i}>
                        <span className="body">
                          {t.url
                            ? <a href={t.url} target="_blank" rel="noopener">{t.venue}</a>
                            : t.venue}
                          {t.byCoauthor && <span className="cl-co">*</span>}
                        </span>
                      </li>
                    ))}
                  </ul>
                </div>
              )}
            </div>
          );
        })}

        <p className="sans" style={{fontSize:14, color:'var(--ink-3)', marginTop:32}}>
          → For presentations by paper, see the <a href="research.html">Research page</a>. For discussions and session chair roles, see <a href="discussions.html">Discussions</a>.
        </p>
      </Layout>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Talks />);
</script>
</body>
