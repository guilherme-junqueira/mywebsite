<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="stylesheet" href="site/styles.css?v=20260725d" />

</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="site/data.js?v=20260725h"></script>
<script type="text/babel" src="site/layout.jsx?v=20260707"></script>
<script type="text/babel" data-presets="react">
  const D = window.SITE_DATA;

  // ③ play button — SVG triangle, dark on cream-white circle
  const PlayIcon = () => (
    <svg width="20" height="22" viewBox="0 0 20 22" aria-hidden="true">
      <path d="M3 2 L18 11 L3 20 Z" fill="#1a1a1a"/>
    </svg>
  );

  // Bold "Best Paper of the Conference" tag after the Spanish Finance Forum.
  function renderVenue(name) {
    if (/Spanish Finance Association['\u2019]s 32nd Finance Forum/i.test(name)) {
      return (
        <React.Fragment>
          {name} <span className="best-paper-tag">(<strong>Best Paper of the Conference</strong>)</span>
        </React.Fragment>
      );
    }
    return name;
  }

  function ytThumb(url) {
    const m = url.match(/[?&]v=([^&]+)/);
    return m ? `https://img.youtube.com/vi/${m[1]}/hqdefault.jpg` : null;
  }

  const LOCATIONS = [
    ["nber tax policy", "Washington, DC"],
    ["nber new developments", "Chicago, IL"],
    ["nber innovation information", "Cambridge, MA"],
    ["nber place-based", "Cambridge, MA"],
    ["nber public economics", "Cambridge, MA"],
    ["nber economic analysis", "Cambridge, MA"],
    ["sfs cavalcade", "Charlottesville, VA"],
    ["cepr development", "Dublin, Ireland"],
    ["cepr summer", "Athens, Greece"],
    ["university of washington 7th summer", "Seattle, WA"],
    ["cca-escp", "Turin, Italy"],
    ["cesifo", "Munich, Germany"],
    ["ifn stockholm", "Stockholm, Sweden"],
    ["inaugural rutgers", "New Brunswick, NJ"],
    ["lake district", "Lancaster, England"],
    ["lse workshop", "London, England"],
    ["luso-brazilian", "Foz do Iguaçu, Brazil"],
    ["sgf conference", "Zurich, Switzerland"],
    ["society of labor economists", "Denver, CO"],
    ["melbourne", "Melbourne, Australia"],
    ["university of minnesota data", "Minneapolis, MN"],
    ["world bank land", "Washington, DC"],
    ["world bank/odi", "Washington, DC"],
    ["esade", "Barcelona, Spain"],
    ["london business school", "London, England"],
    ["university of oregon", "Eugene, OR"],
    ["oxford centre for business", "Oxford, England"],
    ["oxford private equity", "Oxford, England"],
    ["hec paris", "Paris, France"],
    ["boca finance", "Boca Raton, FL"],
    ["finance theory group summer school", "Seattle, WA"],
    ["latin american economic", "Recife, Brazil"],
    ["rcf-ecgi", "Hoboken, NJ"],
    ["wefi", "Online"],
    ["spanish finance association", "Pamplona, Spain"],
    ["national university of singapore", "Singapore"],
    ["abfer", "Singapore"],
    ["rutgers university", "New Brunswick, NJ"],
    ["tulane", "New Orleans, LA"],
    ["university college dublin", "Dublin, Ireland"],
    ["university of edinburgh", "Edinburgh, Scotland"],
    ["university of florida", "Gainesville, FL"],
    ["university of glasgow", "Glasgow, Scotland"],
    ["university of miami", "Miami, FL"],
    ["university of tennessee", "Knoxville, TN"],
    ["washington university in st. louis", "St. Louis, MO"],
    ["bank of england", "London, England"],
    ["federal reserve board", "Washington, DC"],
    ["cear-rsi", "Montreal, Canada"],
    ["raps/rcfs", "Cambridge, England"],
    ["brazilian finance society", "Online"],
    ["copenhagen business school", "Frederiksberg, Denmark"],
    ["cunef", "Madrid, Spain"],
    ["ecgi corporate", "Hoboken, NJ"],
    ["ecgi public lecture", "Online"],
    ["insper", "São Paulo, Brazil"],
    ["university of alabama", "Tuscaloosa, AL"],
    ["university of cambridge", "Cambridge, England"],
    ["university of milan", "Milan, Italy"],
    ["university of naples", "Naples, Italy"],
    ["são paulo", "São Paulo, Brazil"],
    ["sao paulo", "São Paulo, Brazil"],
    ["ut san antonio", "San Antonio, TX"],
    ["efa", "Ghent, Belgium"],
    ["wfa", "Denver, CO"],
    ["firs", "Miami, FL"],
    ["nfa", "Montreal, Canada"],
    ["afa", "Washington, DC"],
    ["aea", "Washington, DC"],
    ["taiwan symposium", "Online"],
    ["wapfin", "New York, NY"],
  ];
  function getLoc(venue) {
    const v = (venue || "").toLowerCase();
    for (const [k, loc] of LOCATIONS) if (v.includes(k)) return loc;
    return null;
  }

  const CONF_LINKS = [
    ["cesifo", "https://www.ifo.de/en/cesifo/event/2026-04-15/cesifo-area-conference-public-economics-2026"],
    ["ecgi corporate", "https://www.ecgi.global/system/files/2025-09/rcf-ecgi-2025-day-1-track-a-programme.pdf"],
    ["boca", "https://business.fau.edu/boca-finance-and-real-estate-conference/"],
    ["spanish finance association", "https://finance-forum.es/"],
  ];
  function getConfUrl(venue) {
    const v = (venue || "").toLowerCase();
    for (const [k, u] of CONF_LINKS) if (v.includes(k)) return u;
    return null;
  }

  // Talks for papers not yet listed on the research page.
  const EXTRA_TALKS = [
    { year: 2026, venue: "Taiwan Symposium on Innovation Economics and Entrepreneurship", url: "https://oir.site.nthu.edu.tw/p/404-1487-164855.php", byCoauthor: true, tag: "New Project", kind: "conference" },
  ];

  function buildAllTalks() {
    const allPapers = [...(D.publications||[]), ...(D.workingPapers||[]), ...(D.worksInProgress||[])];
    const tagFor = (p) => {
      const t = p.title || "";
      if (/Democratizing Venture Capital/i.test(t)) return "QSBS Geography";
      if (/Tax Incentives and Venture Capital/i.test(t)) return "QSBS Risk-Taking";
      if (/Entrepreneurship on a Safety Net/i.test(t)) return "Bolsa Família";
      if (/Homeownership Hinders/i.test(t)) return "Housing Lottery";
      if (/Measuring Innovation/i.test(t)) return "Food Innovation";
      if (/Industrial Organization of Private Equity/i.test(t)) return "PE Industrial Org.";
      return t.split(":")[0];
    };
    const out = [];
    for (const p of allPapers) {
      const tag = tagFor(p);
      let conf = (p.conferences && p.conferences.length) ? p.conferences : (p.topConferences || []);
      if (p.topConferences && (!p.conferences || p.conferences.length === 0)) conf = p.topConferences;
      for (const c of conf) {
        const raw = c.name;
        const byCoauthor = /\*\s*$/.test(raw);
        const cleanName = raw.replace(/\*\s*$/, "").trim();
        const ym = cleanName.match(/(20\d{2})\s*$/);
        const year = ym ? parseInt(ym[1], 10) : null;
        const display = ym ? cleanName.slice(0, ym.index).replace(/[,\s]+$/, '').trim() : cleanName;
        out.push({ year, venue: display, url: c.url, byCoauthor, tag, kind: "conference" });
      }
      for (const s of (p.seminars || [])) {
        const raw = (typeof s === "string") ? s : s.name;
        const byCoauthor = /\*\s*$/.test(raw);
        const cleanName = raw.replace(/\*\s*$/, "").trim();
        const year = (typeof s === "string") ? null : (s.year || null);
        out.push({ year, venue: cleanName, byCoauthor, tag, kind: "seminar" });
      }
    }
    const seen = new Set();
    return [...out, ...EXTRA_TALKS].filter(t => {
      const k = `${t.kind}|${t.venue}|${t.year}|${t.tag}`;
      if (seen.has(k)) return false; seen.add(k); return true;
    });
  }

  function Talks() {
    React.useEffect(() => {
      // Set --talk-total to (count + 1) so first li (counter -1) starts at count.
      const main = document.querySelector('main.cl-main');
      const lis = document.querySelectorAll('.cl-year-block .cl-talks-list li');
      if (main) main.style.setProperty('--talk-total', String(lis.length + 1));
      // Each discussions / session-chair list counts down from its own length.
      document.querySelectorAll('.cl-disc-list').forEach(ul => {
        ul.style.setProperty('--disc-total', String(ul.querySelectorAll('li').length + 1));
      });
    });
    const all = buildAllTalks();
    const byKey = new Map();
    for (const t of all) {
      const k = `${t.kind}|${t.venue}|${t.year}`;
      if (!byKey.has(k)) byKey.set(k, { ...t, count: 1 });
      else { const e = byKey.get(k); e.count += 1; e.byCoauthor = e.byCoauthor || t.byCoauthor; }
    }
    const merged = Array.from(byKey.values());
    const PRIORITY = {
      2026: ["NBER Tax Policy and the Economy","NBER New Developments in Long-Term Asset Management","SFS Cavalcade","WFA","FIRS","EFA","CEPR Development Economics Symposium","CEPR Summer Conference on Financial Intermediation and Corporate Finance","ABFER Annual Conference","University of Washington 7th Summer Finance Conference"],
      2025: [
        "NBER Innovation Information Initiative",
        "NBER Place-Based Policies & Entrepreneurship",
        "NBER Public Economics",
        "NBER Economic Analysis of Business Taxation",
        "London Business School's Private Capital Symposium",
        "University of Oregon Finance Conference",
        "University of Oxford Centre for Business Taxation Doctoral Conference",
        "University of Oxford Private Equity Research Consortium Symposium",
        "HEC Paris Entrepreneurship Workshop",
        "Boca Finance and Real Estate Conference",
        "Finance Theory Group Summer School Conference",
        "Latin American Economic Association",
        "RCF-ECGI Corporate Finance & Governance Conference",
        "WEFI Student-Led Workshop",
        "Spanish Finance Association's 32nd Finance Forum",
      ],
    };
    const SEM_PRIORITY = {
      2026: ["National University of Singapore","University College Dublin","University of Florida"],
      2025: ["Insper","University of São Paulo","UT San Antonio","Brazilian Finance Society"],
    };
    const priorityRank = (t, year) => {
      const list = (t.kind === 'seminar' ? SEM_PRIORITY[year] : PRIORITY[year]);
      if (!list) return Infinity;
      for (let i = 0; i < list.length; i++) if (t.venue.toLowerCase().includes(list[i].toLowerCase())) return i;
      return Infinity;
    };
    const years = Array.from(new Set(merged.map(t => t.year).filter(Boolean))).sort((a,b) => b - a);
    const byYear = Object.fromEntries(years.map(y => [y, merged.filter(t => t.year === y).sort((a,b) => {
      const ra = priorityRank(a, y), rb = priorityRank(b, y);
      if (ra !== rb) return ra - rb;
      return a.venue.localeCompare(b.venue);
    })]));

    return (
      <Layout active="talks">
        <p className="cl-intro">
          Recorded presentations, a full list of <a href="#all-talks">conference and seminar presentations</a> of my work, and the papers I have <a href="#discussions">discussed</a>. For presentations by paper, see <a href="research.html">Research</a>.
        </p>

        <h2 className="cl-section-h" id="recorded">Recorded Presentations</h2>
        <div className="cl-videos">
          {D.videos.map((v,i) => (
            <a key={i} href={v.url} target="_blank" rel="noopener" className="card">
              <div className="thumb" style={{
                backgroundImage: `linear-gradient(180deg, rgba(0,0,0,0.05), rgba(0,0,0,0.45)), url(${ytThumb(v.url)})`,
                backgroundSize: 'cover', backgroundPosition: 'center'
              }}>
                <div className="play-btn"><PlayIcon /></div>
              </div>
              <div className="meta">
                <div className="ttl">{v.title} ({v.year})</div>
                <div className="sub">Paper: {v.paper}</div>
              </div>
            </a>
          ))}
        </div>

        <h2 className="cl-section-h" id="all-talks">Presentations</h2>
        <p className="sans" style={{fontSize:13, color:'var(--ink-3)', marginTop:-6, marginBottom:18}}>
          Conferences and workshops, then seminar series, by year (including scheduled). Entries marked with * were presented by a co-author.
        </p>

        {years.map(y => {
          const all = byYear[y];
          const conf = all.filter(t => t.kind === 'conference');
          const sem = all.filter(t => t.kind === 'seminar');
          return (
            <div key={y} className="cl-year-block">
              <h3 className="cl-year-head">{y}</h3>
              {conf.length > 0 && (
                <div className="cl-subgroup">
                  <div className="cl-sublabel">Conferences &amp; Workshops</div>
                  <ul className="cl-talks-list">
                    {conf.map((t,i) => (
                      <li key={i}>
                        <span className="body">
                          {t.url ? <a href={t.url} target="_blank" rel="noopener">{renderVenue(t.venue)}</a> : renderVenue(t.venue)}
                          {t.count > 1 && <span className="cl-mult"> ({t.count} Papers)</span>}
                          {t.byCoauthor && <span className="cl-co">*</span>}
                        </span>
                        {getLoc(t.venue) && <span className="cl-loc">{getLoc(t.venue)}</span>}
                      </li>
                    ))}
                  </ul>
                </div>
              )}
              {sem.length > 0 && (
                <div className="cl-subgroup">
                  <div className="cl-sublabel">Seminars</div>
                  <ul className="cl-talks-list">
                    {sem.map((t,i) => (
                      <li key={i}>
                        <span className="body">
                          {t.url ? <a href={t.url} target="_blank" rel="noopener">{renderVenue(t.venue)}</a> : renderVenue(t.venue)}
                          {t.byCoauthor && <span className="cl-co">*</span>}
                        </span>
                        {getLoc(t.venue) && <span className="cl-loc">{getLoc(t.venue)}</span>}
                      </li>
                    ))}
                  </ul>
                </div>
              )}
            </div>
          );
        })}

        <h2 className="cl-section-h" id="discussions">Discussions &amp; Service</h2>
        <div className="cl-subgroup">
          <div className="cl-sublabel">Discussions</div>
          <ul className="cl-talks-list cl-disc-list">
            {D.discussions.map((d,i) => (
              <li key={i}>
                <span className="body">
                  <em>“{d.paper}”</em>
                  <span className="sub">by {d.author} — {getConfUrl(d.venue) ? <a href={getConfUrl(d.venue)} target="_blank" rel="noopener" className="conf-link">{d.venue}</a> : d.venue}, {d.year}{d.slidesUrl && <React.Fragment> · <a href={d.slidesUrl} target="_blank" rel="noopener">Slides [PDF]</a></React.Fragment>}</span>
                </span>
                {getLoc(d.venue) && <span className="cl-loc">{getLoc(d.venue)}</span>}
              </li>
            ))}
          </ul>
        </div>
        <div className="cl-subgroup">
          <div className="cl-sublabel">Session Chair</div>
          <ul className="cl-talks-list cl-disc-list">
            {D.sessionChair.map((s,i) => (
              <li key={i}>
                <span className="body">{s.role} — {getConfUrl(s.venue) ? <a href={getConfUrl(s.venue)} target="_blank" rel="noopener" className="conf-link">{s.venue}</a> : s.venue}, {s.year}</span>
                {s.location && <span className="cl-loc">{s.location}</span>}
              </li>
            ))}
          </ul>
        </div>

        <p className="sans" style={{fontSize:14, color:'var(--ink-3)', marginTop:32}}>
          → For presentations by paper, see the <a href="research.html">Research page</a>.
        </p>
      </Layout>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Talks />);
</script>
</body>
</html>
