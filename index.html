<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Guilherme Junqueira</title>
<script src="site/theme-init.js"></script>
<link rel="stylesheet" href="site/styles.css" />
<link rel="icon" type="image/png" sizes="32x32" href="site/assets/favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="site/assets/favicon-180.png" />
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="site/data.js"></script>
<script type="text/babel" src="site/layout.jsx"></script>

<script type="text/babel" data-presets="react">
  const D = window.SITE_DATA;

  function Home() {
    return (
      <Layout active="home" mm>
        <div className="mm-grid">
          <img className="mm-photo" src="site/assets/headshot.png" alt="Guilherme Junqueira" />
          <div>
            <h1 className="mm-name">Guilherme Junqueira</h1>
            <p className="mm-title">4th-Year Finance Ph.D. Candidate <span className="mm-title-aff">· University of Florida</span></p>
            <p className="mm-school">Visiting Ph.D. Student (Fall 2026) · Tuck at Dartmouth College</p>
            <p className="mm-school">Visiting Researcher · Insper</p>
            <p className="mm-contact">
              <a href={`mailto:${D.email}`}>{D.email}</a>
              <span className="mm-contact-sep">·</span>
              <a href={D.cvUrl} target="_blank" rel="noopener">CV (PDF)</a>
            </p>
            <hr className="mm-divider" />
            <p className="mm-ri-label"><strong>Research Interests:</strong></p>
            <ul className="mm-ri">
              <li>Private Capital</li>
              <li>Entrepreneurship &amp; Innovation</li>
              <li>Development &amp; Finance</li>
              <li>Labor &amp; Finance</li>
            </ul>
            <p className="mm-ri-label"><strong>Selected Recent and Scheduled Talks:</strong></p>
            <ul className="mm-ri">
              <li>NBER Place-Based Policies and Entrepreneurship, Fall 2025*</li>
              <li>NBER Innovation Information Initiative, Fall 2025</li>
              <li>NBER New Developments in Long-Term Asset Management, Spring 2026</li>
              <li>NBER Tax Policy and the Economy Annual Conference, 2026</li>
              <li>WFA 2026</li>
              <li>SFS Cavalcade 2026</li>
              <li>FIRS 2026</li>
              <li>EFA 2026 (2 Papers)</li>
            </ul>
            <p style={{fontFamily:'var(--sans)',fontSize:13,color:'var(--ink-3)',fontStyle:'italic',margin:'14px 0 0 0'}}>* Presented by co-author</p>
          </div>
        </div>
      </Layout>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Home />);
</script>
</body>
</html>
