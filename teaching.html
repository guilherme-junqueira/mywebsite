<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script src="site/data.js?v=1777171418575"></script>
<script type="text/babel" src="site/layout.jsx?v=1777171418575"></script>
<script type="text/babel" data-presets="react">
  const D = window.SITE_DATA;
  function Teaching() {
    return (
      <Layout active="teaching">
        <h1 className="cl-page-title">Teaching</h1>
        <p className="cl-page-sub">Courses I have taught at the University of Florida.</p>

        <h2 className="cl-section-h">Instructor of Record</h2>
        {D.teaching.map((t,i) => (
          <article key={i} className="cl-course">
            <div className="cl-course-head"><h3>{t.course}</h3></div>
            <div className="meta">{t.role} · {t.level}</div>
            <p>{t.desc}</p>
            <div className="cl-offerings">
              {t.offerings.map((o,j) => (
                <div key={j} className="cl-offering">
                  <span className="term">{o.term}</span>
                  <span className="rating">{o.note}</span>
                  {o.noteRef && <span className="note-ref"> ({o.noteRef})</span>}
                  {o.syllabus && <React.Fragment> · <a href={o.syllabus} target="_blank" rel="noopener">Syllabus (PDF)</a></React.Fragment>}
                </div>
              ))}
            </div>
          </article>
        ))}
      </Layout>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Teaching />);
</script>
</body>
</html>
