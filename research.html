<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Research — Guilherme Junqueira</title>
<script src="site/theme-init.js?v=20260615"></script>
<link rel="stylesheet" href="site/styles.css?v=20260615" />
<link rel="icon" type="image/png" sizes="32x32" href="site/assets/favicon-32.png?v=20260615" />
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SY28WWYZXQ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-SY28WWYZXQ');
</script>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="site/data.js?v=20260615"></script>
<script type="text/babel" src="site/layout.jsx?v=20260615"></script>
<script type="text/babel" data-presets="react">
  const D = window.SITE_DATA;

  function CopyBtn({ text }) {
    const [copied, setCopied] = React.useState(false);
    const onCopy = (e) => {
      e.preventDefault(); e.stopPropagation();
      navigator.clipboard.writeText(text).then(() => {
        setCopied(true); setTimeout(() => setCopied(false), 1500);
      }).catch(() => {});
    };
    return <button type="button" className="copy-btn" onClick={onCopy}>{copied ? '✓ Copied' : 'Copy'}</button>;
  }

  function AbstractCiteRow({ p }) {
    const [open, setOpen] = React.useState(null);
    const has = (k) => Boolean(p[k]);
    if (!has('abstract') && !has('bibtex')) return null;
    const toggle = (which) => setOpen(o => o === which ? null : which);
    return (
      <div className="paper-toggles">
        <div className="toggle-row">
          {has('abstract') && (
            <button type="button" className={`toggle-link ${open==='abstract'?'open':''}`} onClick={() => toggle('abstract')}>
              <span className="caret">▸</span> ABSTRACT
            </button>
          )}
          {has('bibtex') && (
            <button type="button" className={`toggle-link ${open==='cite'?'open':''}`} onClick={() => toggle('cite')}>
              <span className="caret">▸</span> CITE
            </button>
          )}
        </div>
        {open === 'abstract' && (
          <div className="toggle-body"><p className="abstract-text">{p.abstract}</p></div>
        )}
        {open === 'cite' && (
          <div className="toggle-body">
            {p.bibtex && (
              <div className="cite-block">
                <div className="cite-head"><span className="cite-label">BibTeX</span><CopyBtn text={p.bibtex} /></div>
                <pre className="cite-pre">{p.bibtex}</pre>
              </div>
            )}
            {p.apa && (
              <div className="cite-block">
                <div className="cite-head"><span className="cite-label">APA</span><CopyBtn text={p.apa} /></div>
                <div className="cite-text">{p.apa}</div>
              </div>
            )}
          </div>
        )}
      </div>
    );
  }

  // Render the Spanish Finance Forum venue with its Best Paper tag bolded & parenthesized
  function renderVenueName(name) {
    if (/Spanish Finance Association['\u2019]s 32nd Finance Forum/i.test(name)) {
      // Strip trailing year if present (kept after the tag)
      const m = name.match(/^(.*Spanish Finance Association['\u2019]s 32nd Finance Forum)(.*)$/i);
      const head = m ? m[1] : name;
      const tail = m ? m[2] : '';
      return (
        <React.Fragment>
          {head}{tail} <span className="best-paper-tag">(<strong>Best Paper of the Conference</strong>)</span>
        </React.Fragment>
      );
    }
    return name;
  }

  function PaperDetail({ p }) {
    const authorLine = p.coauthors.length
      ? <React.Fragment>with {p.coauthors.map((c,i) => (
          <React.Fragment key={`${p.n}-${i}`}>
            {i > 0 ? ', ' : ''}
            {c.url ? <a href={c.url} target="_blank" rel="noopener">{c.name}</a> : c.name}
          </React.Fragment>
        ))}</React.Fragment>
      : <span style={{color:'var(--ink-3)', fontStyle:'italic'}}>Solo project.</span>;

    const selected = (p.topConferences || []).filter(c => c && c.url);
    const conferences = p.conferences || [];
    const seminars = p.seminars || [];
    const hasMore = conferences.length > selected.length || seminars.length > 0;

    return (
      <article className="cl-paper-detail">
        {p.versions && p.versions.length > 0 && (
          <div className="paper-versions">
            {p.versions.map((v, i) => (
              <a key={i} href={v.url} target="_blank" rel="noopener">{v.name}</a>
            ))}
          </div>
        )}
        <div className="paper-body">
        <div className="paper-title-row">
          <div className="num">[{String(p.n).padStart(2,'0')}]</div>
          <h3>
            {p.url && p.url !== '#' ? <a href={p.url} target="_blank" rel="noopener">{p.title}</a> : p.title}
          </h3>
        </div>
        <div className="authors">
          {authorLine}
          {p.venue && <React.Fragment> — <span className="venue">{p.venue}</span>{p.status?`, ${p.status}`:''}</React.Fragment>}
        </div>

        <AbstractCiteRow p={p} />

        {p.awards && <div className="badges"><strong className="badges-label">Awarded:</strong> <span className="award-text">{p.awards[0]}</span></div>}

        {p.coverage && (
          <div className="badges">
            <strong className="badges-label">Featured in:</strong>{' '}
            {p.coverage.map((c,i)=> <React.Fragment key={i}>{i>0?' · ':''}<a href={c.url} target="_blank" rel="noopener">{c.name}</a></React.Fragment>)}
          </div>
        )}

        {selected.length > 0 && (
          <div className="badges">
            <strong className="badges-label">Selected presentations:</strong>
            {selected.map((c,i)=> (
              <React.Fragment key={i}>
                {i>0?' · ':''}
                <a href={c.url} target="_blank" rel="noopener" className="conf-link">{renderVenueName(c.name)}</a>
                {c.recordingUrl && <> <a href={c.recordingUrl} target="_blank" rel="noopener" className="video-link">(Video)</a></>}
              </React.Fragment>
            ))}
          </div>
        )}

        {p.note && <p className="note">{p.note}</p>}

        {hasMore && (
          <details className="cl-expand">
            <summary>All conferences &amp; seminars</summary>
            <div className="cl-expand-body">
              {conferences.length > 0 && (
                <div className="group">
                  <div className="lbl">Conferences ({conferences.length})</div>
                  <div>{conferences.map((c,i) => (
                    <React.Fragment key={i}>
                      {i>0 ? ' · ' : ''}
                      {typeof c === 'object'
                        ? (c.url ? <a href={c.url} target="_blank" rel="noopener" className="conf-link">{renderVenueName(c.name)}</a> : renderVenueName(c.name))
                        : renderVenueName(c)}
                    </React.Fragment>
                  ))}</div>
                </div>
              )}
              {seminars.length > 0 && (
                <div className="group">
                  <div className="lbl">Seminars ({seminars.length})</div>
                  <div>{seminars.map((s,i) => {
                    const name = (typeof s === 'string') ? s : s.name;
                    return <React.Fragment key={i}>{i>0 ? ' · ' : ''}{name}</React.Fragment>;
                  })}</div>
                </div>
              )}
              <div style={{fontSize:12, color:'var(--ink-4)', marginTop:8, fontStyle:'italic'}}>* presented by co-author</div>
            </div>
          </details>
        )}
        </div>
      </article>
    );
  }

  function Research() {
    return (
      <Layout active="research" wide>
        
        <h2 className="cl-section-h">Publication</h2>
        {D.publications.map(p => <PaperDetail key={p.n} p={p} />)}

        <h2 className="cl-section-h">Working Papers</h2>
        {D.workingPapers.map(p => <PaperDetail key={p.n} p={p} />)}

        <h2 className="cl-section-h">Works in Progress</h2>
        {D.worksInProgress.map(p => <PaperDetail key={p.n} p={p} />)}
      </Layout>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Research />);
</script>
</body>
</html>
