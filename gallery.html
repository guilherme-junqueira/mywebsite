<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="site/data.js?v=54"></script>
<script type="text/babel" src="site/layout.jsx?v=32"></script>
<script type="text/babel" data-presets="react">
  const D = window.SITE_DATA;

  function Gallery() {
    const [active, setActive] = React.useState(null);

    React.useEffect(() => {
      const onKey = e => { if (e.key === 'Escape') setActive(null); };
      window.addEventListener('keydown', onKey);
      return () => window.removeEventListener('keydown', onKey);
    }, []);

    return (
      <Layout active="gallery" wide>
        <h1 className="cl-page-title">Gallery</h1>
        <p className="cl-page-sub">Conferences, seminars, and the occasional ceremony.</p>

        <div className="cl-gallery">
          {D.gallery.map((g, i) => (
            <figure key={`real-${i}`} onClick={() => setActive({ src: g.src, cap: `${g.caption} — ${g.year}` })} style={{cursor:'zoom-in'}}>
              <img src={g.src} alt={g.caption} style={g.pos ? {objectPosition: g.pos} : undefined} />
              <figcaption>
                {g.caption} <span className="year">({g.year})</span>
              </figcaption>
            </figure>
          ))}
        </div>

        {active && (
          <div className="lb" onClick={() => setActive(null)}>
            <img src={active.src} alt={active.cap} />
            <div className="lb-cap">{active.cap}</div>
          </div>
        )}
      </Layout>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Gallery />);
</script>
</body>
</html>
