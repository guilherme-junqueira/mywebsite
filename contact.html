<script type="text/babel" data-presets="react">
  const D = window.SITE_DATA;
  function Contact() {
    return (
      <Layout active="contact">
        <h1 className="cl-page-title">Contact</h1>

        <div className="cl-contact-block">
          <h2>Email</h2>
          <p><a href={`mailto:${D.email}`}>{D.email}</a></p>
        </div>

        <div className="cl-contact-block">
          <h2>Office</h2>
          <p>{D.office}<br/>
            <span style={{color:'var(--ink-3)', fontSize:15}}>Warrington College of Business · {D.officeAddress}</span>
          </p>
        </div>

        <div className="cl-contact-block">
          <h2>Online</h2>
          <div className="row"><span className="lbl">UF Profile</span><a href={D.ufPage} target="_blank" rel="noopener">warrington.ufl.edu</a></div>
          <div className="row"><span className="lbl">CV</span><a href={D.cvUrl} target="_blank" rel="noopener">Download PDF ↓</a></div>
          <div className="row"><span className="lbl">X</span><a href={D.twitter} target="_blank" rel="noopener">@{D.twitterHandle}</a></div>
          <div className="row"><span className="lbl">LinkedIn</span><a href={D.linkedin} target="_blank" rel="noopener">guilhermejunqueira</a></div>
        </div>
      </Layout>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Contact />);
</script>
